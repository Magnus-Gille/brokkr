# Brokkr · retain enough host journal history to investigate an unplanned reboot
# and to keep weekly jobs' output until the next run.
#
# This is deliberately a drop-in rather than a replacement for journald.conf.
# The cap must keep more than a week of history so a weekly job's logs survive
# until it runs again: about 11 days at the control node's observed ~88 MiB/day.
# A smaller cap fills up under one chatty unit and the journal then reaches back
# only a few days. SystemKeepFree still protects small SD-card-backed hosts, so
# the larger cap never takes the last gigabyte of the disk.
#
# journald frees space by deleting whole archived files, oldest first, and by
# default a file is rotated only at 1/8 of the cap (128M here) or after a month.
# The system journal grows slowly and shares the cap with chattier user
# journals, so one of its files can span many days, and deleting it drops that
# much system history at once: the window weekly jobs depend on can swing
# between almost nothing and the full cap. MaxFileSec rotates a file on the
# first write after it has held a day of entries, so each new file covers about
# a day and deleting one drops about a day. A vacuum can still delete several
# files, existing archives are not split, and the cap is still shared, so this
# narrows the swing; it does not reserve room for system history.
#
# Operators may choose a different local policy, but should retain persistent
# storage and an explicit finite cap.
[Journal]
Storage=persistent
SystemMaxUse=1G
SystemKeepFree=1G
MaxFileSec=1day
