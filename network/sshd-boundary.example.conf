# Example OpenSSH drop-in for a Brokkr-managed Linux host. Reserved example values only.
# Install as /etc/ssh/sshd_config.d/10-brokkr-boundary.conf ONLY by following
# runbooks/nas-control-node-boundary-hardening.md (fresh key proof, a held-open second session,
# `sshd -t`, an armed auto-rollback timer, then `reload`, never `restart`).
#
# Single-value keywords: OpenSSH uses the FIRST value it obtains. Debian-family sshd_config includes
# sshd_config.d/*.conf at the top, in lexical order, so this file beats the main body but is itself
# beaten by any earlier-sorting drop-in (for example 01-*.conf). List-type keywords (AllowUsers,
# AllowGroups, DenyUsers, DenyGroups, ListenAddress, Port, PermitOpen) ACCUMULATE across the main
# file and every drop-in, and a user must pass all Allow/Deny lists, so an existing AllowGroups or
# DenyUsers still applies. Verify the real result with
# `sshd -T -C user=<account>,host=<addr>,addr=<addr>,lport=22` and with real logins, never by reading
# files; `sshd -t` checks syntax only and `sshd -T` does not evaluate admission filters.
#
# Apply in two timer-guarded phases (see the runbook): phase 1 is everything above AllowUsers,
# phase 2 adds AllowUsers.

PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
PermitRootLogin no

# This also breaks ProxyJump through this host, VS Code Remote and SSH tunnels. If a tunnel is the
# chosen disposition (for example to a loopback-only VNC), use instead, ideally inside a Match User:
#   AllowTcpForwarding local
#   PermitOpen 127.0.0.1:5900
AllowTcpForwarding no
AllowStreamLocalForwarding no
AllowAgentForwarding no
X11Forwarding no
GatewayPorts no
PermitTunnel no

# Every key an agent offers counts as a try. Keep this at the default 6 unless clients use
# `IdentitiesOnly yes` with one explicit key.
MaxAuthTries 6
LoginGraceTime 20
ClientAliveInterval 60
ClientAliveCountMax 3

# PHASE 2 ONLY. Admit only the inventoried non-root automation/operator accounts. Replace with the owner inventory.
AllowUsers operator@192.0.2.0/24 operator@198.51.100.0/24

# Do NOT add ListenAddress blindly: if the address is not yet configured at boot (DHCP, tailnet
# interface not up) sshd fails to bind and the host loses its only remote door. Prefer AllowUsers
# source patterns and a firewall decision. Source patterns match the address sshd actually sees: an
# IPv4-only range silently denies the same device arriving over IPv6, the tailnet, or through a NAT
# or subnet router. Also check `sshd -T` for an existing allowgroups/denyusers first, and for
# ssh.socket activation (`systemctl is-active ssh.socket`), where ListenAddress is ignored; use ListenAddress only with a static address and console
# access, as the runbook explains.
