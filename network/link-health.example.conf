# Brokkr wired-link health probe configuration (network/check-link-health.py).
# Copy to ~/.config/brokkr/link-health.conf on the host, chmod 600, then install
# with scripts/deploy-link-health.sh (docs/link-health.md). It is parsed as data,
# never sourced; `check-link-health.py --check-config` validates it. Unknown keys, duplicates, or bad values fail closed.
#
# One record per wired interface: LINK=<iface>,<expected-min-mbps>[,<phy-name>]
# The PHY name lets PHY-level "Downshift occurred" kernel lines be attributed;
# phylib logs them under the PHY device (for r8169: r8169-<bus>-<devid>:<addr>),
# not the interface. Find it with: journalctl -k | grep -i downshift, or
# ls /sys/class/net/<iface>/phydev -l
LINK=enp1s0,2500,r8169-0-100:00

# Optional thresholds (defaults shown).
# FAIL when the kernel logged at least this many link drops in the last hour.
DROPS_1H_FAIL=3
# WARN / FAIL on link drops over the last 24 hours.
DROPS_24H_WARN=2
DROPS_24H_FAIL=24
# WARN on this many PHY downshifts in the last 24 hours.
DOWNSHIFTS_24H_WARN=1
# WARN when tx_errors + rx_errors grew by at least this much since the last run.
ERRORS_WARN=10
