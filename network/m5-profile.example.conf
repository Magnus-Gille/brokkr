# Public-safe example only. Copy to an owner-only local path, replace every
# placeholder from live read-only observations, then install as root:root 0600.
operator_user=operator
management_interface=tailscale0
ssh_port=22

# Confirm the live tailscaled UDP port; 41641 is only its default.
tailscale_transport=eth0|41641

# Repeat exact interface/source pairs needed by encrypted Time Machine clients.
samba_rule=eth0|192.0.2.0/24
samba_rule=tailscale0|198.51.100.0/24

# Enumerate every inference listener. Loopback entries receive no inbound
# allowance; management entries are accepted by the pre-INPUT tailnet gate.
listener=gateway|tcp|8080|management
listener=llama|tcp|8091|loopback
listener=whisper|tcp|8092|management

# NetBIOS/nmbd and SSH forwarding are disabled unless a reviewed consumer and
# a specific exception reason are recorded in the owner-only live profile.
retain_netbios=false
ssh_agent_forwarding=false
ssh_tcp_forwarding=false
ssh_x11_forwarding=false

# The watchdog is armed before the first mutation. Valid range: 60..1800.
rollback_seconds=300
