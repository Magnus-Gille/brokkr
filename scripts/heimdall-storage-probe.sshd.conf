# Managed by Brokkr. This Match block is intentionally narrower than the key
# options: PAM may validate the account, but cannot offer an interactive path.
Match User heimdall-storage-probe
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitEmptyPasswords no
    PermitTTY no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    GatewayPorts no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
    ForceCommand /usr/local/lib/brokkr/heimdall-storage-probe
