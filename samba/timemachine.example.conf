# Copy to timemachine.conf and adapt the path and account locally.
# timemachine.conf is ignored because it describes a live storage host.
# The NAS share is retired. Keep BOTH flags below; default deployment rejects an
# old enabled config. This template does not configure M5 destination telemetry.
[TimeMachine]
   path = /srv/backups/timemachine
   valid users = backupuser
   read only = no
   vfs objects = catia fruit streams_xattr
   available = no
   fruit:time machine = no

# An intentionally active destination requires an adapted operator config and
# explicit BROKKR_SAMBA_TIME_MACHINE_STATE=active. Set a size limit for that host.
